name: Build TiebaAdsBlocker

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install dpkg ldid xz
          sudo mkdir -p /opt/theos
          sudo chown -R $USER /opt/theos

      - name: Install Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git /opt/theos
          /opt/theos/bin/update-theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          echo "TARGET=iphone:clang:latest:14.0" >> $GITHUB_ENV

      - name: Compile dylib
        run: |
          export THEOS=/opt/theos
          export TARGET=iphone:clang:latest:14.0
          make clean
          make
          find .theos -name "*.dylib" 2>/dev/null

      - name: Upload .dylib
        uses: actions/upload-artifact@v4
        with:
          name: TiebaAdsBlocker-dylib
          path: .theos/obj/debug/*.dylib
          if-no-files-found: error

      - name: Build .deb package
        continue-on-error: true
        run: |
          export THEOS=/opt/theos
          make clean package
          ls -la packages/ 2>/dev/null || echo "No .deb created"

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: TiebaAdsBlocker-deb
          path: packages/*.deb
          if-no-files-found: ignore