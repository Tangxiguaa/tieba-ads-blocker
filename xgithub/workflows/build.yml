name: Build TiebaAdsBlocker

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          sudo mkdir -p /opt/theos
          sudo chown -R $USER /opt/theos
          git clone --depth=1 https://github.com/theos/theos.git /opt/theos
          curl -fsSL https://raw.githubusercontent.com/theos/install-toolchain/main/install-toolchain.sh | bash /dev/stdin ios

      - name: Build
        run: |
          export THEOS=/opt/theos
          make clean package
          ls -la packages/

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: TiebaAdsBlocker-deb
          path: packages/*.deb

      - name: Upload raw .dylib
        uses: actions/upload-artifact@v4
        with:
          name: TiebaAdsBlocker-dylib
          path: .theos/obj/debug/TiebaAdsBlocker.dylib
